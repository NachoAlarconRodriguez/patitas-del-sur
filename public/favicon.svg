<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pds_amber_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5BA13"/>
      <stop offset="100%" stop-color="#E09600"/>
    </linearGradient>
    <linearGradient id="paw_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#78350F" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Full-bleed Yellow / Golden Amber Background (macOS/iOS applies native squircle mask cleanly without white corners) -->
  <rect width="512" height="512" fill="url(#pds_amber_bg)"/>

  <g filter="url(#shadow)">
    <!-- Dog Paw Main Metacarpal Pad (Heart-lobed organic dog pad) -->
    <path d="M256,248 C218,248 186,269 170,308 C154,347 174,394 214,404 C236,409 246,395 256,395 C266,395 276,409 298,404 C338,394 358,347 342,308 C326,269 294,248 256,248 Z" fill="url(#paw_dark)"/>

    <!-- Toe 1 (Far Left) -->
    <ellipse cx="136" cy="246" rx="35" ry="50" transform="rotate(-24 136 246)" fill="url(#paw_dark)"/>
    <!-- Toe 2 (Center Left) -->
    <ellipse cx="212" cy="172" rx="36" ry="54" transform="rotate(-7 212 172)" fill="url(#paw_dark)"/>
    <!-- Toe 3 (Center Right) -->
    <ellipse cx="300" cy="172" rx="36" ry="54" transform="rotate(7 300 172)" fill="url(#paw_dark)"/>
    <!-- Toe 4 (Far Right) -->
    <ellipse cx="376" cy="246" rx="35" ry="50" transform="rotate(24 376 246)" fill="url(#paw_dark)"/>
  </g>
</svg>